name: Build AERA Recovery (tulip)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Releases"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Build AERA Recovery for tulip
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      # Must be FIRST (before checkout): it mounts a big LVM volume over the workspace.
      - name: 1. Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          temp-reserve-mb: 2048
          swap-size-mb: 6144
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 2. Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: 3. Verify disk and memory
        run: |
          df -h
          free -h
          nproc

      - name: 4. Install build dependencies and repo
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync lz4 bc libssl-dev ccache
          # optional extras, never fatal
          for p in libncurses5 lib32ncurses-dev earlyoom; do
            sudo apt-get install -y "$p" || echo "optional package $p not available"
          done

          mkdir -p ~/bin
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

          git config --global user.name "shivrajtode"
          git config --global user.email "todeshivraj@gmail.com"
          git config --global color.ui false

      - name: 5. Init and sync AERA 16.0 source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aera"
          cd "$GITHUB_WORKSPACE/aera"
          repo init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0
          for i in 1 2 3; do
            repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j"$(nproc --all)" && break
            echo "repo sync failed (attempt $i), retrying..."
            sleep 20
          done
          test -f build/envsetup.sh
          df -h "$GITHUB_WORKSPACE"

      - name: 6. Inject device tree
        run: |
          T="$GITHUB_WORKSPACE/aera/device/xiaomi/tulip"
          mkdir -p "$T"
          rsync -a --exclude='.git' --exclude='.github' "$GITHUB_WORKSPACE/device_tree/" "$T/"
          ls -la "$T"
          ls -la "$T/prebuilt"

      - name: 7. Compile AERA recovery
        env:
          ALLOW_MISSING_DEPENDENCIES: "true"
          GOGC: "50"
          GOMEMLIMIT: "8GiB"
          LC_ALL: C
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          cd "$GITHUB_WORKSPACE/aera"
          : > "$GITHUB_WORKSPACE/build.log"

          # --- protect the runner agent, make the build the preferred OOM victim ---
          for p in $(pgrep -f 'Runner.Listener|Runner.Worker'); do
            echo -900 | sudo tee /proc/$p/oom_score_adj >/dev/null || true
          done
          echo 800 > /proc/$$/oom_score_adj || true
          sudo sysctl -w vm.swappiness=10 >/dev/null || true
          if command -v earlyoom >/dev/null 2>&1; then
            sudo systemctl stop earlyoom 2>/dev/null || true
            sudo nohup earlyoom -m 5 -s 50 -r 60 --prefer '(soong_build|ckati|ninja|clang|lld|go)' > "$GITHUB_WORKSPACE/earlyoom.log" 2>&1 &
          fi

          # --- live diagnostics: push a small snapshot to ci-logs every 2 min (survives a dying runner) ---
          cat > "$RUNNER_TEMP/pusher.sh" <<'PUSHER'
          #!/bin/bash
          D="$RUNNER_TEMP/livelog"; rm -rf "$D"; mkdir -p "$D"; cd "$D"
          git init -q -b ci-logs
          git config user.name ci; git config user.email ci@users.noreply.github.com
          while true; do
            {
              date -u; uptime; free -m
              df -h "$GITHUB_WORKSPACE" | tail -1
              echo "--- top processes by RSS ---"
              ps -eo pid,rss,pcpu,etime,args --sort=-rss | head -8 | cut -c1-180
              echo "--- earlyoom ---"; tail -n 12 "$GITHUB_WORKSPACE/earlyoom.log" 2>/dev/null
              echo "--- kernel oom ---"; sudo dmesg 2>/dev/null | grep -i -E "out of memory|killed process|oom" | tail -5
              echo "--- resources.log (last 15) ---"; tail -n 15 "$GITHUB_WORKSPACE/resources.log" 2>/dev/null
            } > live.txt 2>&1
            tail -n 60 "$GITHUB_WORKSPACE/build.log" > build-live.log 2>/dev/null
            sed -i 's#x-access-token:[^@]*@#x-access-token:***@#g' live.txt build-live.log
            git add -A; git commit -q --allow-empty -m "live $(date +%T)"
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git" HEAD:ci-logs >/dev/null 2>&1
            sleep 120
          done
          PUSHER
          chmod +x "$RUNNER_TEMP/pusher.sh"
          nohup "$RUNNER_TEMP/pusher.sh" >/dev/null 2>&1 &

          # resource watchdog: one line per minute
          ( while sleep 60; do
              echo "$(date +%T) mem_used=$(free -m | awk '/Mem/{print $3}')MB swap_used=$(free -m | awk '/Swap/{print $3}')MB disk_free=$(df -h --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')"
            done >> "$GITHUB_WORKSPACE/resources.log" ) &

          set +e
          source build/envsetup.sh
          lunch twrp_tulip-bp2a-eng || lunch twrp_tulip-eng
          LUNCH_RC=$?
          set -e
          echo "lunch rc=$LUNCH_RC  TARGET_PRODUCT=$TARGET_PRODUCT"
          test -n "$TARGET_PRODUCT"

          set -o pipefail
          echo "=== PHASE 1: analysis only (m nothing) ===" | tee -a "$GITHUB_WORKSPACE/build.log"
          m nothing 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          echo "=== PHASE 2: adbd + recoveryimage ===" | tee -a "$GITHUB_WORKSPACE/build.log"
          mka adbd recoveryimage -j3 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: 8. Validate recovery output
        run: |
          OUT="$GITHUB_WORKSPACE/aera/out/target/product/tulip"
          ls -lh "$OUT" || true
          IMG=$(find "$OUT" -maxdepth 1 -type f -name 'AERA-*.img' | head -n 1)
          [ -z "$IMG" ] && IMG=$(find "$OUT" -maxdepth 1 -type f -name 'recovery.img' | head -n 1)
          if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
            echo "::error::Recovery image was not generated"
            exit 1
          fi
          SIZE=$(stat -c%s "$IMG")
          echo "Built: $IMG ($SIZE bytes)"
          if [ "$SIZE" -gt 67108864 ]; then
            echo "::error::Recovery image is bigger than the 64MB tulip recovery partition ($SIZE)"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$IMG" "$GITHUB_WORKSPACE/artifacts/"
          [ "$(basename "$IMG")" != "recovery.img" ] && cp "$IMG" "$GITHUB_WORKSPACE/artifacts/recovery.img"
          echo "IMG_SIZE=$SIZE" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: 9. Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-tulip-${{ github.run_number }}
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: 10. Create GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aera-tulip-v${{ github.run_number }}
          name: AERA Recovery for Redmi Note 6 Pro (tulip) - Build ${{ github.run_number }}
          body: |
            ## AERA Recovery for Xiaomi Redmi Note 6 Pro (`tulip`)

            - **Size:** ${{ env.IMG_SIZE }} bytes (partition limit 67108864)
            - **Header:** v0, gzip ramdisk, prebuilt 4.19 SouthWest-NG kernel

            Test first (nothing is written):
            ```
            fastboot boot recovery.img
            ```
            Then flash:
            ```
            fastboot flash recovery recovery.img
            ```
          files: ${{ github.workspace }}/artifacts/*

      # Pushes a small diagnostics bundle to the ci-logs branch so failures can be read without logging in.
      - name: 11. Publish diagnostics to ci-logs branch
        if: always()
        continue-on-error: true
        run: |
          pkill -f pusher.sh || true
          D="$RUNNER_TEMP/ci"; rm -rf "$D"; mkdir -p "$D"
          {
            echo "run=${{ github.run_number }} commit=${{ github.sha }} job_status=${{ job.status }}"
            echo "--- resources (last 60) ---"; tail -n 60 "$GITHUB_WORKSPACE/resources.log" 2>/dev/null
            echo "--- df ---"; df -h
            echo "--- free ---"; free -m
            echo "--- earlyoom ---"; tail -n 30 "$GITHUB_WORKSPACE/earlyoom.log" 2>/dev/null
            echo "--- out dir ---"; ls -lh "$GITHUB_WORKSPACE/aera/out/target/product/tulip" 2>/dev/null | head -60
          } > "$D/summary.txt"
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            tail -n 300 "$GITHUB_WORKSPACE/build.log" > "$D/build-tail.log"
            grep -n -E "error:|FAILED:|Error [0-9]+|fatal|undefined reference|No rule to make|too large|ERROR|ninja: " "$GITHUB_WORKSPACE/build.log" | head -120 > "$D/errors.txt" || true
          fi
          [ -f "$GITHUB_WORKSPACE/aera/out/error.log" ] && head -c 60000 "$GITHUB_WORKSPACE/aera/out/error.log" > "$D/soong-error.log"
          cd "$D"
          git init -q -b ci-logs
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "diagnostics for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
