name: Build AERA Recovery (tulip)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Releases"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Build AERA Recovery for tulip
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 2. Maximize Build Space (Restructure Disk to ~120GB)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 3. Verify Disk and Memory
        run: |
          echo "=== Disk Layout ==="
          df -h
          echo "=== Memory & Swap ==="
          free -h

      - name: 4. Install Build Dependencies & Setup Repo
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync lz4 bc ccache libssl-dev

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

          git config --global user.name "shivrajtode"
          git config --global user.email "todeshivraj@gmail.com"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: 5. Init & Shallow Sync AERA 16.0 Source
        run: |
          # Use GITHUB_WORKSPACE (mounted on the massive ~120GB partition)
          WORKDIR="${GITHUB_WORKSPACE}/aera_workdir"
          mkdir -p "${WORKDIR}"
          cd "${WORKDIR}"

          echo "=== Initializing AERA Manifest ==="
          repo init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0

          # Ensure all ssh urls are replaced with https
          find .repo/manifests -name "*.xml" -exec sed -i 's|ssh://git@github.com/|https://github.com/|g' {} + || true

          echo "=== Shallow Syncing AERA Source ==="
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all) || repo sync -c -j4

      - name: 6. Inject Device Tree
        run: |
          WORKDIR="${GITHUB_WORKSPACE}/aera_workdir"
          TARGET_DIR="${WORKDIR}/device/xiaomi/tulip"
          mkdir -p "${TARGET_DIR}"
          # Copy our repository files into device/xiaomi/tulip
          rsync -av --exclude='.git' --exclude='aera_workdir' "${GITHUB_WORKSPACE}/" "${TARGET_DIR}/"
          ls -la "${TARGET_DIR}"

      - name: 7. Space Saver: Erase .repo Directory (~25GB Free Space)
        run: |
          WORKDIR="${GITHUB_WORKSPACE}/aera_workdir"
          cd "${WORKDIR}"
          echo "=== Disk Before Removing .repo ==="
          df -h "${WORKDIR}"

          echo "Deleting .repo to reclaim ~25GB of storage..."
          rm -rf .repo

          echo "=== Disk After Removing .repo ==="
          df -h "${WORKDIR}"

      - name: 8. Compile AERA Recovery
        env:
          # Soong memory limits to prevent OOM
          GOGC: "50"
          GOMEMLIMIT: "12GiB"
          ALLOW_MISSING_DEPENDENCIES: "true"
        run: |
          WORKDIR="${GITHUB_WORKSPACE}/aera_workdir"
          cd "${WORKDIR}"
          source build/envsetup.sh

          echo "=== Loading Lunch Target ==="
          lunch twrp_tulip-bp2a-eng || lunch aera_tulip-bp2a-eng || lunch twrp_tulip-eng

          echo "=== Building Recovery Image ==="
          if command -v mka >/dev/null 2>&1; then
            mka recoveryimage -j$(nproc --all)
          else
            m recoveryimage -j$(nproc --all)
          fi

      - name: 9. Validate Recovery Output
        id: validate
        run: |
          WORKDIR="${GITHUB_WORKSPACE}/aera_workdir"
          OUT_DIR="${WORKDIR}/out/target/product/tulip"
          echo "Inspecting output directory:"
          ls -lh "${OUT_DIR}" || true

          IMG_PATH=$(find "${OUT_DIR}" -maxdepth 1 -type f \( -name 'AERA-*.img' -o -name 'recovery.img' \) | head -n 1)
          if [ -z "$IMG_PATH" ] || [ ! -f "$IMG_PATH" ]; then
            echo "::error::Recovery image was not generated!"
            exit 1
          fi

          SIZE=$(stat -c%s "$IMG_PATH")
          echo "Built recovery image: $IMG_PATH ($SIZE bytes)"
          # Tulip recovery partition size is strictly 64MB (67108864 bytes)
          if [ "$SIZE" -gt 67108864 ]; then
            echo "::error::Recovery image exceeds tulip 64MB partition limit ($SIZE > 67108864)!"
            exit 1
          fi

          echo "Recovery image verified and within partition limits."
          echo "IMG_PATH=$IMG_PATH" >> $GITHUB_ENV
          echo "IMG_SIZE=$SIZE" >> $GITHUB_ENV

          # Gather outputs for release
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          find "${OUT_DIR}" -maxdepth 1 -type f \( -name "*.img" -o -name "*.zip" \) -exec cp {} "${GITHUB_WORKSPACE}/artifacts/" \;
          ls -lh "${GITHUB_WORKSPACE}/artifacts/"

      - name: 10. Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-tulip-${{ github.run_number }}
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: warn
          retention-days: 14

      - name: 11. Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aera-tulip-v${{ github.run_number }}
          name: AERA Recovery for Redmi Note 6 Pro (tulip) - Build #${{ github.run_number }}
          body: |
            ## AERA Recovery for Xiaomi Redmi Note 6 Pro (`tulip`)

            - **SoC:** Qualcomm Snapdragon 636 (`sdm660`)
            - **Kernel:** 4.19.325 unified with FT8719 BOE and all tulip display panel DTBs
            - **Header Version:** v0
            - **Ramdisk Compression:** gzip (anti-bootloop)
            - **Size:** ${{ env.IMG_SIZE }} bytes (<= 64MB partition limit)

            ### Flashing Instructions:
            1. Test boot without writing:
               ```bash
               fastboot boot recovery.img
               ```
            2. Once verified, permanently flash:
               ```bash
               fastboot flash recovery recovery.img
               fastboot reboot recovery
               ```
          files: ${{ github.workspace }}/artifacts/*

      - name: 12. Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/aera_workdir/out/error.log
            ${{ github.workspace }}/aera_workdir/out/verbose.log.gz
          if-no-files-found: ignore
