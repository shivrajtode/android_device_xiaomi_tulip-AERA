name: Build AERA Recovery (tulip)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Releases"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 repo ccache rsync bc libncurses5-dev libssl-dev

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Initialize and Sync AERA Manifest
        run: |
          mkdir -p ~/aera-workdir
          cd ~/aera-workdir
          git config --global user.name "shivrajtode"
          git config --global user.email "todeshivraj@gmail.com"
          repo init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)

      - name: Inject Device Tree
        run: |
          mkdir -p ~/aera-workdir/device/xiaomi/tulip
          cp -r $GITHUB_WORKSPACE/device_tree/* ~/aera-workdir/device/xiaomi/tulip/
          ls -la ~/aera-workdir/device/xiaomi/tulip

      - name: Compile AERA Recovery
        run: |
          cd ~/aera-workdir
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          echo "=== Executing Android 16 bp2a Lunch Combo ==="
          lunch twrp_tulip-bp2a-eng || lunch aera_tulip-bp2a-eng || lunch twrp_tulip-eng
          mka adbd recoveryimage -j$(nproc --all)

      - name: Validate Recovery Image
        id: check_image
        run: |
          OUT_DIR="$HOME/aera-workdir/out/target/product/tulip"
          echo "Inspecting output directory: $OUT_DIR"
          ls -lh "$OUT_DIR" || true

          IMG_PATH=$(find "$OUT_DIR" -maxdepth 1 -type f \( -name 'AERA-*.img' -o -name 'recovery.img' \) | head -n 1)
          if [ -z "$IMG_PATH" ] || [ ! -f "$IMG_PATH" ]; then
            echo "::error::Recovery image was not generated!"
            exit 1
          fi

          SIZE=$(stat -c%s "$IMG_PATH")
          echo "Built recovery image: $IMG_PATH ($SIZE bytes)"
          # Tulip recovery partition is exactly 64MB (67108864 bytes)
          if [ "$SIZE" -gt 67108864 ]; then
            echo "::error::Recovery image exceeds the tulip 64MB partition limit ($SIZE > 67108864)!"
            exit 1
          fi

          echo "Recovery image verified and within partition limits."
          echo "IMG_PATH=$IMG_PATH" >> $GITHUB_ENV
          echo "IMG_SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-tulip-${{ github.run_number }}
          path: |
            ~/aera-workdir/out/target/product/tulip/AERA-R*.img
            ~/aera-workdir/out/target/product/tulip/AERA-R*.zip
            ~/aera-workdir/out/target/product/tulip/recovery.img
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aera-tulip-v${{ github.run_number }}
          name: AERA Recovery for Redmi Note 6 Pro (tulip) - Build #${{ github.run_number }}
          body: |
            ## AERA Recovery for Xiaomi Redmi Note 6 Pro (`tulip`)

            - **SoC:** Qualcomm Snapdragon 636 (`sdm660`)
            - **Kernel:** 4.19.325 unified with FT8719 BOE and all tulip display panel DTBs
            - **Header Version:** v0
            - **Ramdisk Compression:** gzip (anti-bootloop)
            - **Size:** ${{ env.IMG_SIZE }} bytes (<= 64MB partition limit)

            ### Flashing Instructions:
            1. Test boot without writing:
               ```bash
               fastboot boot recovery.img
               ```
            2. Once verified, permanently flash:
               ```bash
               fastboot flash recovery recovery.img
               fastboot reboot recovery
               ```
          files: |
            ~/aera-workdir/out/target/product/tulip/AERA-R*.img
            ~/aera-workdir/out/target/product/tulip/AERA-R*.zip
            ~/aera-workdir/out/target/product/tulip/recovery.img

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            ~/aera-workdir/out/error.log
            ~/aera-workdir/out/verbose.log.gz
          if-no-files-found: ignore
